services:
  mysql:
    image: mysql:8.0
    container_name: secondhand-mysql
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: second_hand_trading
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./src/main/resources/circleu.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p123456"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - secondhand-network

  redis:
    image: redis:7-alpine
    container_name: secondhand-redis
    ports:
      - "6380:6379"
    networks:
      - secondhand-network

  rocketmq-namesrv:
    image: apache/rocketmq:5.1.4
    container_name: secondhand-rocketmq-namesrv
    command: sh mqnamesrv
    ports:
      - "9876:9876"
    networks:
      - secondhand-network

  rocketmq-broker:
    image: apache/rocketmq:5.1.4
    container_name: secondhand-rocketmq-broker
    command: sh mqbroker -n rocketmq-namesrv:9876 -c /home/rocketmq/rocketmq-5.1.4/conf/broker.conf
    ports:
      - "10911:10911"
      - "10909:10909"
    environment:
      JAVA_OPT_EXT: "-Xms512m -Xmx512m -Xmn128m"
    depends_on:
      - rocketmq-namesrv
    networks:
      - secondhand-network

  sentinel-dashboard:
    image: apache/sentinel-dashboard:1.8.8
    container_name: secondhand-sentinel-dashboard
    ports:
      - "8858:8080"
    environment:
      SENTINEL_DASHBOARD_USERNAME: admin
      SENTINEL_DASHBOARD_PASSWORD: admin
    networks:
      - secondhand-network

  app:
    build: .
    container_name: secondhand-app
    ports:
      - "8081:8080"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
      rocketmq-broker:
        condition: service_started
      sentinel-dashboard:
        condition: service_started
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/second_hand_trading?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: 123456
      SPRING_DATA_REDIS_HOST: redis
      ROCKETMQ_NAME_SERVER: rocketmq-namesrv:9876
      JAVA_TOOL_OPTIONS: "-Dcsp.sentinel.dashboard.server=sentinel-dashboard:8080"
    networks:
      - secondhand-network

volumes:
  mysql-data:

networks:
  secondhand-network:
    driver: bridge